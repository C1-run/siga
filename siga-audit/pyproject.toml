[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siga-audit"
version = "0.1.0"
description = "Backtest audit engine — out-of-sample verdict, cost sensitivity, small-sample guard. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Selo", email = "team@c1.run"}]
requires-python = ">=3.11"
keywords = ["backtest", "audit", "statistics", "trading", "out-of-sample"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["siga-trail"]

[tool.setuptools.packages.find]
include = ["siga_audit*"]
